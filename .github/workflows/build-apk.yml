name: Gerar APK Web App (Capacitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código
      uses: actions/checkout@v4

    - name: Configurar Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependências e compilar Web
      run: |
        npm install
        npm run build

    - name: Configurar Capacitor e Plataforma Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Consulta CNPJ" "com.consultacnpj.app" --web-dir dist
        npx cap add android
        npx cap sync android

    - name: Dar permissão ao Gradle
      run: chmod +x android/gradlew

    - name: Compilar APK (Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Salvar APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: ConsultaCNPJ-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
